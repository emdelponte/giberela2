[project]
name = "fhb-prediction-model-mcp"
version = "0.1.0"
description = "FastMCP server for Fusarium Head Blight (FHB) weather-driven prediction and economic analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp<2",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
